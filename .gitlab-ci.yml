# GitLab CI for PuckUtilityApp.
#
#   test     every push to a branch, every merge request, every tag: `make test`
#            (this repo's unit tests). Make it required for merging
#            (Settings > Merge requests > Pipelines must succeed).
#   release  tag push (release-vX.Y.Z, optionally -suffix) only, after test:
#            scripts/check-release-tag.sh, then the .run installer, the debs
#            and the wheels (the app and p4core: the submodules are on no
#            index, so `pip install build/wheel/*.whl`, plus wxPython for the
#            GUI), kept forever.
#   release-win  tag push only, after test, on the `xtest` runner (it has
#            wine 9.0): the tag check, then scripts/build-win32-wine.sh builds
#            PuckUtilityApp-win-vX.Y.Z-setup.exe under wine, kept forever. The
#            wine prefix is cached in the runner user's ~/.cache. The runner is
#            protected, so release-v* must be a protected tag (Settings >
#            Repository > Protected tags).
#   xtest    scheduled pipelines and "Run pipeline" only, after test:
#            `make xtest` (scripts/test-cross-ubuntu.sh, Ubuntu 20.04 to 26.04:
#            source, pip and installer). Runs on the dedicated
#            `xtest` runner (Ubuntu 24.04 VM, shell executor, rootless podman;
#            CONTAINER=podman comes from its config.toml). That runner is
#            protected, so schedule it on a protected branch. XTEST_ARGS picks a
#            subset in the "Run pipeline" form, e.g. `--no-pip 24.04`. Run it
#            on the commit you are about to tag: tag pipelines do not run it.
#
# `puck` runner setup (once; test and release, and the other puck projects'
# jobs). It is a group runner on the `software` group (tag `puck`, untagged
# jobs off, not protected: merge request pipelines must reach it), on the same
# VM as `xtest` (ewok), as the runner user that owns rootless podman:
#   systemctl --user enable --now podman.socket
#   podman build -t docker.io/burt/puck-deb-u20:latest -f scripts/Dockerfile.builder .
#   gitlab-runner register ... --executor docker \
#     --docker-image docker.io/burt/puck-deb-u20 \
#     --docker-host unix:///run/user/<uid>/podman/podman.sock \
#     --docker-pull-policy if-not-present
#   The image is local only, hence if-not-present, and the docker.io/ name:
#   podman's Docker API looks a short name up as docker.io/..., not the
#   localhost/... a bare -t gives. Rebuild the image after a Python / wxPython /
#   Dockerfile.builder change; requirements*.txt changes are synced by the
#   jobs themselves.
# GitLab setup (once):
#   p4core > Settings > CI/CD > Job token permissions: add this project, so
#   the job token can clone the p4core submodule.
# The installer ships a firmware/ folder holding only a README.txt (the
# technician adds .ebin files after installing), so no firmware is fetched here.

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  # Test workers: the runner also builds other projects, so not every CPU.
  TEST_JOBS: "4"
  XTEST_ARGS:
    value: ""
    description: "xtest only: scripts/test-cross-ubuntu.sh arguments, e.g. --no-pip 24.04 (empty: all four releases, every half)"

# One pipeline per push: a branch with an open merge request gets the merge
# request pipeline only.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - test
  - xtest
  - release

test:
  stage: test
  image: burt/puck-deb-u20
  tags:
    - puck
  script:
    # An image built before make/xvfb were added to Dockerfile.builder: install
    # them for this job (rebuild the image to skip this).
    - 'command -v make >/dev/null && command -v xvfb-run >/dev/null || { echo "NOTE: burt/puck-deb-u20 predates the test tools, installing them (rebuild the image)"; apt-get update -qq && apt-get install -y -qq --no-install-recommends make git xvfb xauth >/dev/null; }'
    - uv pip install -q --python /opt/puckbuild -r requirements.txt -r requirements-test.txt
    - make test PYTHON=/opt/puckbuild/bin/python TEST_JOBS=$TEST_JOBS

xtest:
  stage: xtest
  tags:
    - xtest
  timeout: 4h
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
  script:
    # Only test-cross-ubuntu.sh's own arguments, so a typo fails here.
    - 'for a in $XTEST_ARGS; do case "$a" in --source-only|--no-pip|[0-9][0-9].04|[0-9][0-9].10) ;; *) echo "ERROR: XTEST_ARGS: unknown argument $a"; exit 1 ;; esac; done'
    - podman --version
    - make xtest XTEST_ARGS="$XTEST_ARGS"

release:
  stage: release
  image: burt/puck-deb-u20
  tags:
    - puck
  rules:
    - if: $CI_COMMIT_TAG
  script:
    # The tag must name the version the app reports, and not a DEV build (the
    # same check as the pre-push hook).
    - bash scripts/check-release-tag.sh "$CI_COMMIT_TAG"
    - uv pip install -q --python /opt/puckbuild -r requirements.txt
    - VENV_ROOT=/opt/puckbuild bash scripts/build-linux-installer.sh --installer
    - 'for src in . p4core; do uv build -q --wheel --python /opt/puckbuild/bin/python --out-dir build/wheel "$src"; done'
  artifacts:
    name: "puckutility-linux-${CI_COMMIT_TAG}"
    paths:
      - build/*-installer.run
      - build/deb/*.deb
      - build/wheel/*.whl
    expire_in: never

release-win:
  stage: release
  tags:
    - xtest
  timeout: 2h
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - bash scripts/check-release-tag.sh "$CI_COMMIT_TAG"
    - wine --version
    - bash scripts/build-win32-wine.sh
  artifacts:
    name: "puckutility-win-${CI_COMMIT_TAG}"
    paths:
      - build/win/*-setup.exe
    expire_in: never
